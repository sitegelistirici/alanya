<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alanya İtiraf Portalı</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <button id="hamburger" class="hamburger">☰</button>
                <div class="logo">🔥 ALANYA İTİRAF</div>
            </div>
        </header>

        <aside id="sidebar" class="sidebar">
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-tab="home">🏠 Ana Sayfa</a>
                <a href="#" class="nav-item" data-tab="confessions">📜 İtiraflar</a>
                <a href="#" class="nav-item" data-tab="submit">✍️ İtiraf Ver</a>
                <a href="#" class="nav-item" data-tab="polls">📊 Anketler</a>
                <a href="#" class="nav-item" data-tab="leaders">🏆 Liderler</a>
                <a href="#" class="nav-item" data-tab="admin">🔑 Admin</a>
            </nav>
        </aside>

        <div id="overlay" class="overlay"></div>

        <main class="main-content">
            <div id="home" class="tab-content active">Ana Sayfa İçeriği</div>
            <div id="confessions" class="tab-content">İtiraflar İçeriği</div>
            <div id="submit" class="tab-content">İtiraf Ver İçeriği</div>
            <div id="polls" class="tab-content">Anketler İçeriği</div>
            <div id="leaders" class="tab-content">Liderler İçeriği</div>
            <div id="admin" class="tab-content">Admin İçeriği</div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
